
[build]
  publish = "widget"

[[redirects]]
  from = "/api/*"
  to = "https://tobago-moon-tide-api.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://experience.arcgis.com https://tidemonitoringdeployment.onrender.com"
